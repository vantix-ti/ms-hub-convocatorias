# Server
server.port=8080
server.servlet.context-path=/api

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hub_convocatorias}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:dev123qwe}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — Flyway gestiona el esquema; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail
spring.mail.host=${MAIL_HOST:mail.vantix.cl}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USER:noreply@vantix.cl}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.default-encoding=UTF-8

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=${UPLOAD_DIR:uploads}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# App
app.url=${APP_URL:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator
management.health.mail.enabled=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
